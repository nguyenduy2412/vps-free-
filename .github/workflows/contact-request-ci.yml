name: Contact Request CI

on:
  push:
    branches:
      - main
      - dev
      - feature/**
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: contact-request-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Validate Contact Request
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Audit Contact source package scope
        shell: bash
        run: |
          set -euo pipefail
          package="TV3-Duy-Contact-Source"
          test -f "$package/docs/README.md"
          test -f "$package/src/CloudServiceStore.Application/ContactRequests/ContactRequestService.cs"
          test -f "$package/src/CloudServiceStore.WebApi/Controllers/ContactRequestsController.cs"
          test -f "$package/frontend/src/app/contact/page.tsx"
          test -f "$package/frontend/src/app/admin/contact-requests/page.tsx"
          test -f "$package/scripts/Build-And-AddContactRequestMigration.ps1"
          grep -q 'sys.sp_getapplock' "$package/src/CloudServiceStore.Infrastructure/Persistence/ContactRequestRepository.cs"
          grep -q 'ContactRequestLockUnavailableException' "$package/src/CloudServiceStore.Infrastructure/Persistence/ContactRequestRepository.cs"
          grep -q 'ConfigureContactRequestRateLimiting' "$package/src/CloudServiceStore.WebApi/Security/ContactRequestRateLimitExtensions.cs"
          ! grep -q 'services.AddRateLimiter' "$package/src/CloudServiceStore.WebApi/Security/ContactRequestRateLimitExtensions.cs"
          grep -q 'REQUIRE_CONTACT_SQLSERVER_TESTS' "$package/tests/CloudServiceStore.Integration.Tests/ContactRequestSqlServerMigrationTests.cs"
          grep -q 'SqlServer_concurrent_different_emails_do_not_block_each_other' "$package/tests/CloudServiceStore.Integration.Tests/ContactRequestSqlServerMigrationTests.cs"
          grep -q 'SqlServer_app_lock_timeout_returns_unavailable_and_does_not_persist_request' "$package/tests/CloudServiceStore.Integration.Tests/ContactRequestSqlServerMigrationTests.cs"
          grep -q 'Contact request received.' "$package/src/CloudServiceStore.Application/ContactRequests/ContactRequestService.cs"
          grep -q 'GetAllowedTransitions(item.Status)' "$package/src/CloudServiceStore.Application/ContactRequests/ContactRequestService.cs"
          test "$(find "$package" -type f | wc -l)" -le 50
          test -z "$(find "$package" -type f \( -name '*.pdf' -o -name '*.docx' -o -name 'package-lock.json' \) -print -quit)"

      - name: Detect full CloudServiceStore baseline
        id: layout
        shell: bash
        run: |
          if [[ -f CloudServiceStore.sln && -f frontend/package.json && -f frontend/package-lock.json ]]; then
            echo "full_baseline=true" >> "$GITHUB_OUTPUT"
          else
            echo "full_baseline=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up .NET
        if: steps.layout.outputs.full_baseline == 'true'
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore, build and test backend
        if: steps.layout.outputs.full_baseline == 'true'
        shell: bash
        run: |
          dotnet restore CloudServiceStore.sln
          dotnet build CloudServiceStore.sln --configuration Release --no-restore
          dotnet test CloudServiceStore.sln --configuration Release --no-build --no-restore

      - name: Set up Node.js
        if: steps.layout.outputs.full_baseline == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Lint and build frontend
        if: steps.layout.outputs.full_baseline == 'true'
        working-directory: frontend
        shell: bash
        run: |
          npm ci
          npm run lint
          NODE_ENV=production npm run build

      - name: Report source-package limitation
        if: steps.layout.outputs.full_baseline != 'true'
        shell: bash
        run: |
          echo "::notice::Contact source-package scope audit passed. Full build and test require a CloudServiceStore baseline checkout."
